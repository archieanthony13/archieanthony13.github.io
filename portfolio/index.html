<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Archie Anthony | Portfolio</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="shortcut icon" href="../assets/icons/logo.png" type="image/png">
</head>
<body>
    <div class="header">
        <br>
        <div class="buttons">
            <a href="../">Home</a>
            <a href="../contact/">Contact</a>
        </div>
        <div class="menu-button">
            <img src="../assets/icons/menu.png" alt="">
        </div>
    </div>
    <br>
    <div class="body" id="portfolio">
        <script>
            function create(portfolio){
                let years = Object.keys(portfolio).sort((a, b) => b - a)
                for(let year=0;year<years.length;year++){
                    let dates = Object.keys(portfolio[years[year]]).sort((a, b) => b - a)
                    for(let date=0;date<dates.length;date++){
                        let show = portfolio[years[year]][dates[date]]
                        let div = document.createElement("div")
                        let divImg = document.createElement("div")
                        let divText = document.createElement("div")
                        div.className = "portfolio-highlight"
                        divImg.className = "image"
                        divText.className = "text"
                        let image = document.createElement("img")
                        image.src = "./" + show.url + "/images/" + show.image
                        let link = document.createElement("a")
                        link.href = show.url
                        link.innerHTML = show.title
                        let text = document.createElement("p")
                        text.innerHTML = show.role
                        divImg.append(image)
                        divText.append(link)
                        divText.append(text)
                        div.appendChild(divImg)
                        div.appendChild(divText)
                        document.getElementById("portfolio").append(div)
                    }
                }
            }
            fetch('https://www.archieanthony.com/portfolio/portfolio.json')
                .then(response => response.json())
                .then(data => {
                    create(data)
                })
                .catch(error => console.error('Error loading JSON:', error));
        </script>
    </div>
    <div class="footer">
        <div class="logos">
            <a href="https://www.facebook.com/archieanthony13/" target="_blank"><img src="../assets/icons/facebook.png" alt=""></a>
            <a href="https://www.instagram.com/archieanthony13/" target="_blank"><img src="../assets/icons/instagram.png" alt=""></a>
            <a href="https://www.linkedin.com/in/archieanthony/" target="_blank"><img src="../assets/icons/linkedin.png" alt=""></a>
        </div>
    </div>
    <div class="menu">
        <a href="../">Home</a>
        <a href="../contact/">Contact</a>
    </div>
    <script src="../menu.js"></script>
</body>
</html>
